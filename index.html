    /* ── UTILITIES ── */
    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function speak(text) {
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-GB";
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      } catch {}
    }

    function starsFor(mistakes) { return mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1; }

    function getXpLevel(xp) {
      if (xp >= 300) return { name:"Fodboldlegende 🏆", next:400, color:"#fbbf24" };
      if (xp >= 180) return { name:"Holdkaptajn 🎖️",   next:300, color:"#22c55e" };
      if (xp >= 80)  return { name:"Startspiller ⚽",   next:180, color:"#3b82f6" };
      return { name:"Reservespiller 🪑", next:80, color:"#94a3b8" };
    }

    function loadSaved() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
    }

    /* ── STADIUM BACKGROUND ── */
    function StadiumBg() {
      return (
        <div style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:0, overflow:"hidden" }}>
          <div style={{ position:"absolute", inset:0, backgroundImage:"repeating-linear-gradient(0deg, rgba(34,197,94,.04) 0, rgba(34,197,94,.04) 70px, transparent 70px, transparent 140px)" }} />
          {LIGHTS.map((l,i) => (
            <div key={i} style={{ position:"absolute", left:l.left, top:l.top, width:l.size, height:l.size, borderRadius:"50%", background:"radial-gradient(circle, rgba(255,255,220,.07) 0%, transparent 65%)", transform:"translate(-50%,-50%)", animation:`floodPulse ${3+i*.8}s ${i*.6}s ease-in-out infinite` }} />
          ))}
        </div>
      );
    }

      const base = xp>=300?300 : xp>=180?180 : xp>=80?80 : 0;
      const pct  = Math.min(((xp-base)/(lvl.next-base))*100, 100);
      return (
        <div style={{ width:"100%", marginBottom:18 }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:7, fontSize:13, fontWeight:900, color:"rgba(255,255,255,.75)" }}>
            <span>{lvl.name}</span>
            <span style={{ color:"#fbbf24" }}>⚽ {xp} pts</span>
          </div>
          <div style={{ background:"rgba(255,255,255,.08)", borderRadius:50, height:15, border:"1px solid rgba(255,255,255,.12)", overflow:"hidden" }}>
            <div style={{ height:"100%", borderRadius:50, width:`${pct}%`, background:`linear-gradient(90deg,${lvl.color},#fbbf24)`, transition:"width .8s ease", position:"relative" }}>
              <div style={{ position:"absolute", inset:"3px 3px 3px", borderRadius:50, background:"linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)" }} />
            </div>
          </div>
        </div>
      );
    }

    /* ── WORD MATCH ── */
    function WordMatchGame({ content, onComplete }) {
      const pairs = content.wordPairs.slice(0,6);
      const [daSelected, setDaSelected] = useState(null);
      const [enSelected, setEnSelected] = useState(null);
      const [matched,    setMatched]    = useState(new Set());
      const [wrongAnim,  setWrongAnim]  = useState(false);
      const [feedback,   setFeedback]   = useState(null);
      const [enWords]   = useState(() => shuffle(pairs.map(p => ({ en:p.en, da:p.da }))));
      const mistakesRef = useRef(0);

      useEffect(() => {
        if (daSelected !== null && enSelected !== null) {
          const ok = pairs[daSelected].en === enWords[enSelected].en;
          if (ok) {
            const next = new Set([...matched, daSelected+"_da", enSelected+"_en"]);
            setMatched(next);
            setFeedback("MÅL! ⚽");
            speak(enWords[enSelected].en);
            setTimeout(() => setFeedback(null), 1300);
            if (next.size/2 === pairs.length) setTimeout(() => onComplete(pairs.length*13, mistakesRef.current), 700);
          } else {
            mistakesRef.current += 1;
            setWrongAnim(true);
            setFeedback("Offside! ❌");
            setTimeout(() => { setWrongAnim(false); setFeedback(null); }, 750);
          }
          setTimeout(() => { setDaSelected(null); setEnSelected(null); }, 320);
        }
      }, [daSelected, enSelected]);

      const matchedCount = matched.size/2;
      return (
        <div style={{ width:"100%" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
            <h2 style={{ fontFamily:"'Bebas Neue',cursive", fontSize:28, letterSpacing:2, color:"#86efac" }}>🔤 Ord-Aflevering</h2>
            <div style={{ background:"rgba(34,197,94,.2)", border:"1px solid rgba(34,197,94,.4)", borderRadius:8, padding:"6px 14px", fontWeight:900, fontSize:14, color:"#86efac" }}>{matchedCount}/{pairs.length} ✓</div>
          </div>
          <p style={{ color:"rgba(255,255,255,.5)", fontSize:14, marginBottom:16, fontWeight:700 }}>Klik på et dansk ord og det engelske der passer! 👆</p>
          {feedback && <GoalFlash msg={feedback} />}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              <div style={{ textAlign:"center", fontSize:11, fontWeight:900, color:"rgba(255,255,255,.35)", marginBottom:4, textTransform:"uppercase", letterSpacing:1.5 }}>🇩🇰 Dansk</div>
              {pairs.map((p,i) => {
                const isDone=matched.has(i+"_da"), isSel=daSelected===i;
                return <div key={i} onClick={() => { if(!isDone) setDaSelected(i===daSelected?null:i); }} style={{ padding:"12px 10px", borderRadius:12, textAlign:"center", fontSize:15, fontWeight:800, cursor:isDone?"default":"pointer", border:isSel?"2px solid #22c55e":isDone?"2px solid rgba(34,197,94,.4)":"2px solid rgba(255,255,255,.12)", background:isSel?"rgba(34,197,94,.3)":isDone?"rgba(34,197,94,.15)":"rgba(255,255,255,.05)", transform:isSel?"scale(1.05)":"scale(1)", opacity:isDone?.45:1, transition:"all .18s", animation:wrongAnim&&isSel?"shake .4s":undefined }}>{p.e} {p.da}</div>;
              })}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              <div style={{ textAlign:"center", fontSize:11, fontWeight:900, color:"rgba(255,255,255,.35)", marginBottom:4, textTransform:"uppercase", letterSpacing:1.5 }}>🇬🇧 English</div>
              {enWords.map((w,i) => {
                const isDone=matched.has(i+"_en"), isSel=enSelected===i;
                return <div key={i} onClick={() => { if(!isDone) setEnSelected(i===enSelected?null:i); }} style={{ padding:"12px 10px", borderRadius:12, textAlign:"center", fontSize:15, fontWeight:800, cursor:isDone?"default":"pointer", border:isSel?"2px solid #fbbf24":isDone?"2px solid rgba(34,197,94,.4)":"2px solid rgba(255,255,255,.12)", background:isSel?"rgba(251,191,36,.25)":isDone?"rgba(34,197,94,.15)":"rgba(255,255,255,.05)", transform:isSel?"scale(1.05)":"scale(1)", opacity:isDone?.45:1, transition:"all .18s" }}>{w.en}</div>;
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ── STORY GAME ── */
    function StoryGame({ content, onComplete }) {
      const story = content.story;
      const [phase,    setPhase]    = useState("read");
      const [qIdx,     setQIdx]     = useState(0);
      const [answered, setAnswered] = useState(null);
      const [score,    setScore]    = useState(0);
      const [feedback, setFeedback] = useState(null);

      const handleAnswer = (idx) => {
        if (answered !== null) return;
        setAnswered(idx);
        const correct = idx === story.qs[qIdx].a;
        const ns = score + (correct?1:0);
        setFeedback(correct ? "KORREKT! 🎯" : "Ikke helt! 💪");
        setTimeout(() => {
          setFeedback(null);
          if (qIdx+1 < story.qs.length) { setQIdx(q=>q+1); setAnswered(null); if(correct) setScore(ns); }
          else { if(correct) setScore(ns); setTimeout(() => onComplete(ns*15, story.qs.length - ns), 800); }
        }, 1500);
      };

      return (
        <div style={{ width:"100%" }}>
          <h2 style={{ fontFamily:"'Bebas Neue',cursive", fontSize:28, letterSpacing:2, color:"#fcd34d", marginBottom:16 }}>📰 Kamprapport</h2>
          {feedback && <GoalFlash msg={feedback} />}
          {phase === "read" ? (
            <div style={{ animation:"fadeUp .4s ease" }}>
              <Card>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>

                    style={{ background:"rgba(251,191,36,.15)", border:"1.5px solid rgba(251,191,36,.4)", borderRadius:10, padding:"8px 12px", fontSize:18, cursor:"pointer" }}>🔊</button>
                </div>
                <div style={{ background:"rgba(0,0,0,.4)", borderRadius:12, padding:"16px 18px", borderLeft:"4px solid #22c55e", marginBottom:18 }}>
                  {story.text.split("\n\n").map((para,i,arr) => <p key={i} style={{ fontSize:15, lineHeight:1.9, color:"rgba(255,255,255,.88)", marginBottom:i<arr.length-1?14:0, fontWeight:600 }}>{para}</p>)}
                </div>
                <Btn onClick={() => { window.speechSynthesis.cancel(); setPhase("quiz"); }} variant="primary" style={{ width:"100%" }}>Svar på spørgsmål 💬</Btn>
              </Card>
            </div>
          ) : (
            <div key={qIdx} style={{ animation:"popIn .35s ease" }}>
              <div style={{ background:"rgba(0,0,0,.6)", borderRadius:10, padding:"8px 16px", display:"flex", justifyContent:"space-between", marginBottom:16, fontSize:13, fontWeight:900 }}>
                <span style={{ color:"rgba(255,255,255,.5)" }}>Spørgsmål {qIdx+1}/{story.qs.length}</span>
                <span style={{ color:"#fbbf24" }}>⚽ {score*15} pts</span>
              </div>
              <Card>
                <p style={{ fontSize:17, fontWeight:900, marginBottom:20, lineHeight:1.55 }}>🤔 {story.qs[qIdx].q}</p>
                {story.qs[qIdx].opts.map((opt,i) => {
                  let bg="rgba(255,255,255,.05)", border="rgba(255,255,255,.12)";
                  if (answered !== null) {
                    if (i===story.qs[qIdx].a)   { bg="rgba(34,197,94,.3)";  border="#22c55e"; }
                    else if (i===answered)        { bg="rgba(239,68,68,.25)"; border="#ef4444"; }
                  }
                  return <button key={i} onClick={() => handleAnswer(i)} disabled={answered!==null} style={{ display:"block", width:"100%", padding:"13px 16px", margin:"8px 0", borderRadius:12, border:`2px solid ${border}`, background:bg, color:"white", fontFamily:"'Nunito',sans-serif", fontSize:15, fontWeight:800, cursor:answered!==null?"default":"pointer", textAlign:"left", transition:"all .2s", animation:answered!==null&&i===story.qs[qIdx].a?"correctPop .4s ease":undefined }}>{opt}</button>;
                })}
              </Card>
            </div>
          )}
        </div>
      );
    }

    /* ── SPELLING ── */
    function SpellingGame({ content, onComplete }) {
      const words = content.spellingWords;
      const [queue,    setQueue]    = useState(() => [...words]);
      const [idx,      setIdx]      = useState(0);
      const [input,    setInput]    = useState("");
      const [status,   setStatus]   = useState(null);
      const [score,    setScore]    = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [attempts, setAttempts] = useState(0);
      const [goals,    setGoals]    = useState(0);
      const mistakesRef = useRef(0);
      const word = queue[idx];

      const advance = (ns) => {
        if (idx+1 < queue.length) { setIdx(i=>i+1); setInput(""); setStatus(null); setAttempts(0); }
        else setTimeout(() => onComplete(ns, mistakesRef.current), 500);
      };

      const check = () => {
        if (!input.trim() || status !== null) return;
        const ok = input.trim().toLowerCase() === word.en.toLowerCase();
        if (ok) {
          setStatus("correct");
          const pts = attempts===0?20:10, ns=score+pts;
          setScore(ns); setGoals(g=>g+1);
          setFeedback("MÅL! ⚽");
          speak(word.en);
          setTimeout(() => { setFeedback(null); advance(ns); }, 1000);
        } else if (attempts+1 >= 3) {
          mistakesRef.current += 1;
          setStatus("reveal");
          setFeedback("Næste gang! 💪");
          speak(word.en);
          setTimeout(() => { setFeedback(null); advance(score); }, 2400);
        } else {
          mistakesRef.current += 1;
          setStatus("wrong");
          setAttempts(a=>a+1);
          setFeedback("Prøv igen! 💪");
          setTimeout(() => { setStatus(null); setInput(""); setFeedback(null); }, 1100);
        }
      };

      const skip = () => {
        if (status !== null || idx+1 >= queue.length) return;
        setQueue(q => [...q.slice(0,idx), ...q.slice(idx+1), q[idx]]);
        setInput(""); setAttempts(0);
      };

      return (
        <div style={{ width:"100%" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
            <h2 style={{ fontFamily:"'Bebas Neue',cursive", fontSize:28, letterSpacing:2, color:"#93c5fd" }}>⚽ MÅLSPARK</h2>
            <div style={{ background:"rgba(59,130,246,.2)", border:"1px solid rgba(59,130,246,.4)", borderRadius:8, padding:"6px 14px", fontWeight:900, fontSize:13, color:"#93c5fd" }}>{idx+1}/{queue.length}</div>
          </div>
          {feedback && <GoalFlash msg={feedback} />}
          <div style={{ display:"flex", gap:6, marginBottom:18, justifyContent:"center" }}>
            {words.map((_,i) => <div key={i} style={{ fontSize:20, filter:i<goals?"none":"grayscale(1) opacity(.3)", transition:"filter .3s" }}>⚽</div>)}
          </div>
          <div key={word.en} style={{ animation:"popIn .35s ease" }}>
            <Card style={{ textAlign:"center" }}>
              <div style={{ fontSize:70, marginBottom:10, animation:"floatY 2.2s ease-in-out infinite" }}>{word.hint}</div>
              <div style={{ background:"rgba(0,0,0,.5)", borderRadius:12, padding:"14px 20px", marginBottom:20, border:"1px solid rgba(255,255,255,.1)" }}>
                <div style={{ fontSize:11, fontWeight:900, color:"rgba(255,255,255,.35)", textTransform:"uppercase", letterSpacing:2, marginBottom:6 }}>🇩🇰 Dansk ord</div>
                <div style={{ fontFamily:"'Bebas Neue',cursive", fontSize:42, letterSpacing:3, color:"white" }}>{word.da}</div>
              </div>
              <p style={{ color:"rgba(255,255,255,.55)", fontSize:14, fontWeight:800, marginBottom:14 }}>Hvad er det på engelsk? 🇬🇧</p>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&check()} placeholder="Skriv her..." autoFocus
                autoCapitalize="none" autoCorrect="off" spellCheck={false} enterKeyHint="go"
                onFocus={e=>{ const el=e.currentTarget; setTimeout(() => el.scrollIntoView({ block:"center", behavior:"smooth" }), 250); }}
                style={{ width:"100%", padding:"15px 20px", borderRadius:12, fontSize:22, fontWeight:900, textAlign:"center", fontFamily:"'Nunito',sans-serif", outline:"none", background:status==="correct"?"rgba(34,197,94,.2)":status==="wrong"?"rgba(239,68,68,.15)":"rgba(255,255,255,.08)", border:`2px solid ${status==="correct"?"#22c55e":status==="wrong"?"#ef4444":"rgba(255,255,255,.2)"}`, color:"white", marginBottom:16, animation:status==="wrong"?"shake .4s":undefined, transition:"border-color .2s, background .2s" }} />
              <div style={{ display:"flex", gap:10 }}>
                <Btn onClick={check} variant="blue" style={{ flex:1, fontSize:18 }} disabled={!input.trim()||status!==null}>Spark! ⚽</Btn>
                {idx+1 < queue.length && (
                  <Btn onClick={skip} variant="ghost" style={{ fontSize:14, padding:"13px 18px" }} disabled={status!==null}>Spring over ⏭️</Btn>
                )}
              </div>
              {status==="reveal" && (
                <div style={{ marginTop:14, background:"rgba(34,197,94,.12)", border:"1px solid rgba(34,197,94,.35)", borderRadius:10, padding:"12px 14px", animation:"popIn .3s ease" }}>
                  <p style={{ color:"#86efac", fontSize:14, fontWeight:800 }}>Det rigtige ord er: <span style={{ fontFamily:"'Bebas Neue',cursive", fontSize:22, letterSpacing:2, color:"#22c55e" }}>{word.en}</span> 🔊</p>
                </div>
              )}
              {attempts>0 && status===null && (
                <div style={{ marginTop:14, background:"rgba(251,191,36,.1)", border:"1px solid rgba(251,191,36,.25)", borderRadius:10, padding:"10px 14px" }}>
                  <p style={{ color:"#fcd34d", fontSize:13, fontWeight:800 }}>💡 Hint: Starter med "{word.en[0].toUpperCase()}" — {word.en.length} bogstaver</p>
                </div>
              )}
            </Card>
          </div>
        </div>
      );
    }

    /* ── FILL IN THE BLANK ── */
    function FillInGame({ content, onComplete }) {
      const sentences = content.fillIn;
      const [idx,      setIdx]      = useState(0);
      const [answered, setAnswered] = useState(null);
      const [score,    setScore]    = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [opts]     = useState(() => sentences.map(s => shuffle(s.opts)));
      const current    = sentences[idx];

      const handlePick = (opt) => {
        if (answered !== null) return;
        setAnswered(opt);
        const correct = opt === current.missing;
        const ns = score + (correct?1:0);
        setFeedback(correct ? "MÅL! ⚽" : "Prøv igen! 💪");
        if (correct) speak(current.sentence.replace("___", current.missing));
        setTimeout(() => {
          setFeedback(null);
          if (idx+1 < sentences.length) { setIdx(i=>i+1); setAnswered(null); if(correct) setScore(ns); }
          else { if(correct) setScore(ns); setTimeout(() => onComplete(ns*25, sentences.length - ns), 600); }
        }, 1400);
      };

      const parts = current.sentence.split("___");
      return (
        <div style={{ width:"100%" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
            <h2 style={{ fontFamily:"'Bebas Neue',cursive", fontSize:28, letterSpacing:2, color:"#c4b5fd" }}>✏️ Udfyld Sætningen</h2>
            <div style={{ background:"rgba(124,58,237,.2)", border:"1px solid rgba(124,58,237,.4)", borderRadius:8, padding:"6px 14px", fontWeight:900, fontSize:13, color:"#c4b5fd" }}>{idx+1}/{sentences.length}</div>
          </div>
          {feedback && <GoalFlash msg={feedback} />}
          <div key={idx} style={{ animation:"popIn .35s ease" }}>
            <Card style={{ textAlign:"center" }}>
              <p style={{ fontSize:13, color:"rgba(255,255,255,.4)", fontWeight:800, marginBottom:16, fontStyle:"italic" }}>🇩🇰 {current.da}</p>
              <div style={{ background:"rgba(0,0,0,.4)", borderRadius:14, padding:"18px 16px", marginBottom:22, border:"1px solid rgba(124,58,237,.3)", fontSize:19, fontWeight:900, lineHeight:1.6 }}>
                <span style={{ color:"rgba(255,255,255,.85)" }}>{parts[0]}</span>
                <span style={{ display:"inline-block", minWidth:90, borderBottom:"3px solid #a78bfa", margin:"0 6px", textAlign:"center", color:answered?(answered===current.missing?"#22c55e":"#ef4444"):"#a78bfa", fontFamily:"'Bebas Neue',cursive", letterSpacing:2, fontSize:22 }}>
                  {answered || "___"}
                </span>
                <span style={{ color:"rgba(255,255,255,.85)" }}>{parts[1]}</span>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                {opts[idx].map((opt,i) => {
                  let bg="rgba(255,255,255,.06)", border="rgba(255,255,255,.15)", color="white";
                  if (answered !== null) {
                    if (opt===current.missing)  { bg="rgba(34,197,94,.3)";  border="#22c55e"; }
                    else if (opt===answered)     { bg="rgba(239,68,68,.2)";  border="#ef4444"; color="rgba(255,255,255,.6)"; }
                    else                         { bg="rgba(255,255,255,.03)"; color="rgba(255,255,255,.3)"; }
                  }
                  return <button key={i} onClick={() => handlePick(opt)} disabled={answered!==null} style={{ padding:"13px 10px", borderRadius:12, border:`2px solid ${border}`, background:bg, color, fontFamily:"'Nunito',sans-serif", fontSize:14, fontWeight:900, cursor:answered!==null?"default":"pointer", transition:"all .2s" }}>{opt}</button>;
                })}
              </div>
            </Card>
          </div>
        </div>
      );
    }

    /* ── TRUE OR FALSE ── */
    function TrueFalseGame({ content, onComplete }) {
      const questions = content.trueFalse;
      const [idx,      setIdx]      = useState(0);
      const [answered, setAnswered] = useState(null);
      const [score,    setScore]    = useState(0);
      const [feedback, setFeedback] = useState(null);
      const current = questions[idx];

      const handlePick = (pick) => {
        if (answered !== null) return;
        setAnswered(pick);
        const correct = pick === current.answer;
        const ns = score + (correct?1:0);
        setFeedback(correct ? "KORREKT! 🎯" : "Ikke helt! 💪");
        setTimeout(() => {
          setFeedback(null);
          if (idx+1 < questions.length) { setIdx(i=>i+1); setAnswered(null); if(correct) setScore(ns); }
          else { if(correct) setScore(ns); setTimeout(() => onComplete(ns*18, questions.length - ns), 600); }
        }, 1400);
      };

      return (
        <div style={{ width:"100%" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
            <h2 style={{ fontFamily:"'Bebas Neue',cursive", fontSize:28, letterSpacing:2, color:"#f9a8d4" }}>❓ Sandt eller Falsk?</h2>
            <div style={{ background:"rgba(190,24,93,.2)", border:"1px solid rgba(190,24,93,.4)", borderRadius:8, padding:"6px 14px", fontWeight:900, fontSize:13, color:"#f9a8d4" }}>{idx+1}/{questions.length}</div>
          </div>
          {feedback && <GoalFlash msg={feedback} />}
          <div key={idx} style={{ animation:"popIn .35s ease" }}>
            <Card style={{ textAlign:"center" }}>
              <p style={{ fontSize:13, color:"rgba(255,255,255,.4)", fontWeight:800, marginBottom:12, fontStyle:"italic" }}>{current.da}</p>
              <div style={{ background:"rgba(0,0,0,.4)", borderRadius:14, padding:"22px 18px", marginBottom:24, border:"1px solid rgba(190,24,93,.25)", fontSize:18, fontWeight:900, lineHeight:1.6, color:"rgba(255,255,255,.9)" }}>
                "{current.statement}"
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                {[{val:true,label:"✅ Sandt",color:"#22c55e",dim:"rgba(34,197,94,.3)"},{val:false,label:"❌ Falsk",color:"#ef4444",dim:"rgba(239,68,68,.2)"}].map(({val,label,color,dim}) => {
                  let bg="rgba(255,255,255,.06)", border="rgba(255,255,255,.15)", opacity=1;
                  if (answered !== null) {
                    if (val===current.answer)  { bg=dim; border=color; }
                    else if (val===answered)    { bg="rgba(239,68,68,.15)"; border="#ef4444"; opacity=0.5; }
                    else                        { opacity=0.3; }
                  }
                  return <button key={String(val)} onClick={() => handlePick(val)} disabled={answered!==null} style={{ padding:"18px 10px", borderRadius:14, border:`2px solid ${border}`, background:bg, color:"white", fontFamily:"'Bebas Neue',cursive", fontSize:22, letterSpacing:1.5, cursor:answered!==null?"default":"pointer", transition:"all .2s", opacity }}>{label}</button>;
                })}
              </div>
              {answered !== null && (
                <p style={{ marginTop:16, fontSize:13, fontWeight:800, color:answered===current.answer?"#86efac":"#fca5a5" }}>
                  {answered===current.answer ? "Rigtigt! 🎉" : `Forkert — det rigtige svar er: ${current.answer?"Sandt ✅":"Falsk ❌"}`}
                </p>
              )}
            </Card>
          </div>
        </div>
      );
    }

    /* ── KAMP VUNDET ── */
    function KampVundetScreen({ kamp, xp, hasNext, onNext, onHome }) {
      const lvl = getXpLevel(xp);
      return (
        <div style={{ textAlign:"center", width:"100%", animation:"popIn .5s ease" }}>
          <Confetti />
          <div style={{ fontSize:88, animation:"floatY 2s ease-in-out infinite", marginBottom:12 }}>
            {hasNext ? "⚽" : "🏆"}
          </div>
          <h1 className="win-title" style={{ fontFamily:"'Bebas Neue',cursive", letterSpacing:3, background:"linear-gradient(135deg,#fbbf24,#f97316,#22c55e)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:8 }}>
            {hasNext ? `KAMP ${kamp} VUNDET!` : "NIVEAU GENNEMFØRT!"}
          </h1>
          <p style={{ color:"rgba(255,255,255,.65)", fontSize:17, fontWeight:800, marginBottom:28 }}>
            {hasNext ? "Fremragende! Klar til næste kamp?" : "Du har klaret alle kampe! Fantastisk! 🎉"}
          </p>
          <Card style={{ maxWidth:380, margin:"0 auto 24px" }}>
            <div style={{ background:"rgba(0,0,0,.5)", borderRadius:12, padding:"14px 20px", marginBottom:16, border:"1px solid rgba(255,255,255,.1)" }}>
              <div style={{ fontSize:11, fontWeight:900, color:"rgba(255,255,255,.4)", textTransform:"uppercase", letterSpacing:2, marginBottom:4 }}>Samlet score</div>
              <div style={{ fontFamily:"'Bebas Neue',cursive", fontSize:50, letterSpacing:3, color:"#fbbf24" }}>{xp} pts</div>
              <div style={{ color:"rgba(255,255,255,.55)", fontSize:14, fontWeight:700 }}>{lvl.name}</div>
            </div>
            <XPBar xp={xp} />
          </Card>
          <div style={{ display:"flex", gap:12, justifyContent:"center", flexWrap:"wrap" }}>
            {hasNext && (
              <Btn onClick={onNext} variant="gold" style={{ fontSize:18, padding:"15px 32px" }}>
                Næste kamp →
              </Btn>
            )}
            <Btn onClick={onHome} variant="ghost" style={{ fontSize:16, padding:"13px 24px" }}>
              {hasNext ? "← Hjem" : "🔄 Spil igen"}
            </Btn>
          </div>
        </div>
      );
    }

    /* ── ROOT APP ── */
    function App() {
      const saved = loadSaved();
      const [screen,    setScreen]    = useState("home");
      const [level,     setLevel]     = useState(saved.level     ?? 1);
      const [kamp,      setKamp]      = useState(saved.kamp      ?? 1);
      const [xp,        setXp]        = useState(saved.xp        ?? 0);
      const [completed, setCompleted] = useState(() => {
        const c = saved.completed;
        if (Array.isArray(c)) return Object.fromEntries(c.map(id => [id, 1]));
        return c ?? {};
      });

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ level, kamp, xp, completed }));
      }, [level, kamp, xp, completed]);

      const handleComplete = useCallback((game, earned, mistakes) => {
        const newXp = xp + earned;
        setXp(newXp);
        const newCompleted = { ...completed, [game]: starsFor(mistakes ?? 0) };
        setCompleted(newCompleted);
        if (Object.keys(newCompleted).length === GAMES.length) {
          setScreen("kampvundet");
        } else {
          setScreen("map");
        }
      }, [xp, completed]);

      const handleNextKamp = () => {
        setKamp(k => k + 1);
        setCompleted({});
        setScreen("map");
      };

      const handleChangeLevel = (n) => {
        setLevel(n);
        setKamp(1);
        setXp(0);
        setCompleted({});
      };

      const handleHome = () => setScreen("home");

      const totalKampe = CONTENT[level].kampe.length;
      const hasNextKamp = kamp < totalKampe;
      const content = CONTENT[level].kampe[kamp - 1];
      const gameScreens = ["wordmatch","story","spelling","fillin","truefalse"];

      return (
        <div className="app-shell" style={{ background:"linear-gradient(160deg,#040f04 0%,#071a07 40%,#0d2b0d 100%)", fontFamily:"'Nunito',sans-serif", color:"white", position:"relative", overflowX:"hidden" }}>
          <StadiumBg />
          <div className="app-inner" style={{ position:"relative", zIndex:1, maxWidth:560, margin:"0 auto", padding:"28px 18px" }}>

            {screen === "home" && <HomeScreen onStart={() => setScreen("map")} level={level} onChangeLevel={handleChangeLevel} />}

            {screen === "map" && <MapScreen xp={xp} completed={completed} onSelect={id => setScreen(id)} onHome={handleHome} level={level} kamp={kamp} />}

            {screen === "kampvundet" && <KampVundetScreen kamp={kamp} xp={xp} hasNext={hasNextKamp} onNext={handleNextKamp} onHome={() => { handleChangeLevel(level); setScreen("home"); }} />}

            {gameScreens.includes(screen) && (
              <div style={{ width:"100%" }}>
                <XPBar xp={xp} />
                {screen==="wordmatch"  && <WordMatchGame  content={content} onComplete={(e,m) => handleComplete("wordmatch", e, m)} />}
                {screen==="story"      && <StoryGame      content={content} onComplete={(e,m) => handleComplete("story",     e, m)} />}
                {screen==="spelling"   && <SpellingGame   content={content} onComplete={(e,m) => handleComplete("spelling",  e, m)} />}
                {screen==="fillin"     && <FillInGame     content={content} onComplete={(e,m) => handleComplete("fillin",    e, m)} />}
                {screen==="truefalse"  && <TrueFalseGame  content={content} onComplete={(e,m) => handleComplete("truefalse", e, m)} />}
                <div style={{ marginTop:20 }}>
                  <Btn onClick={() => { window.speechSynthesis.cancel(); setScreen("map"); }} variant="ghost" style={{ fontSize:14, padding:"10px 20px" }}>← Tilbage til banen</Btn>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
